<style>
:root{
  --red:#E0262F; --purple:#9B5DE5; --lilac:#C9B3EE; --white:#F6F2EF; --ink:#0E0C0C; --card:#1A1717;
  --line:#2E2929; --muted:#A39C98; --dim:#7A7270; --soft:#D8D1CD; --error:#FF6B6B;
  --sans:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  --top:env(safe-area-inset-top,0px); --bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
*{box-sizing:border-box}
*::-webkit-scrollbar{display:none;width:0;height:0}
html,body{margin:0;height:100%}
body{background:#151212;font-family:var(--sans);color:var(--white);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
[hidden]{display:none!important}
a{color:var(--lilac)}
button,input,select{font-family:inherit;color:inherit}
button{cursor:pointer}
button:active{transform:scale(.98)}
:focus-visible{outline:2px solid var(--purple);outline-offset:2px}

.app{position:relative;max-width:480px;height:100%;margin:0 auto;background:var(--ink);overflow:hidden}
@media (min-width:520px){.app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
.scroll{position:absolute;inset:0;overflow-y:auto;scrollbar-width:none;padding:calc(var(--top) + 16px) 18px calc(var(--bottom) + 120px)}
.stack{display:flex;flex-direction:column;gap:16px}
.mono{font-family:var(--mono)}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.h1{font-size:40px;font-weight:900;font-stretch:72%;text-transform:uppercase;line-height:1;margin:0}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}

/* Login / boas-vindas */
.login{position:absolute;inset:0;display:flex;flex-direction:column;padding:calc(var(--top) + 32px) 28px calc(var(--bottom) + 40px)}
.login .tag{display:flex;gap:6px;align-items:center;color:var(--muted)}
.login .tag i{width:8px;height:8px;border-radius:50%;background:var(--purple)}
.login .mid{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px}
.login .tour{font-size:15px;font-weight:600;color:var(--red);letter-spacing:.2em}
.login .big{font-size:64px;line-height:.88;font-weight:900;font-stretch:72%;text-transform:uppercase;letter-spacing:-.01em}
.login .big span{color:var(--red)}
.login .bar{height:4px;width:64px;background:var(--white)}
.login .lede{font-size:17px;line-height:1.4;color:var(--soft);max-width:300px;text-wrap:pretty;margin:0}
.btn-white{height:56px;border-radius:16px;border:none;background:var(--white);color:var(--ink);font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:12px;width:100%}
.btn-white .g{width:26px;height:26px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center}
.btn-red{height:56px;border-radius:16px;border:none;background:var(--red);color:var(--white);font-size:17px;font-weight:800;letter-spacing:.02em;width:100%}
.btn-red[disabled],.btn-white[disabled]{opacity:.5}
.foot{text-align:center;font-family:var(--mono);font-size:11px;color:var(--dim)}

/* Campos */
.field{display:flex;flex-direction:column;gap:8px}
.field>span{color:var(--muted)}
.input{height:52px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--white);padding:0 14px;font-size:16px;outline:none;width:100%;min-width:0}
.input:focus{border-color:var(--purple)}
.input.bad{border-color:var(--error)}
.input.good{border-color:var(--purple)}
.err{font-size:13px;color:var(--error)}
.ok{font-size:13px;color:var(--lilac)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--white);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0;height:58px}
.day small{font-family:var(--mono);font-size:9px}
.day b{font-size:18px;font-weight:800}
.day.on{background:var(--red);border-color:var(--red)}
.people{display:flex;flex-wrap:wrap;gap:8px}
.person{height:44px;padding:0 14px 0 6px;border-radius:22px;border:1.5px solid var(--line);background:transparent;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600}
.person.on{background:#2A1F38;border-color:var(--purple)}

/* Avatares */
.av{flex:none;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
.avs{display:flex}
.avs .av{margin-right:-8px;border:2px solid var(--card)}
.me{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;border:2px solid var(--purple);font-size:16px;padding:0}

/* Feed */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-18px;padding-inline:18px}
.chip{flex:none;height:34px;padding:0 14px;border-radius:17px;border:1px solid var(--line);background:transparent;color:var(--white);font-size:14px;font-weight:600}
.chip span{opacity:.6;font-weight:500}
.chip.on{background:var(--white);color:var(--ink);border-color:var(--white)}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.embed{height:580px;max-height:78vh;background:#000}
.embed.preview{height:420px;border-radius:16px;overflow:hidden;border:1px solid var(--line)}
a.poster{text-decoration:none}
.embed iframe{width:100%;height:100%;border:0;display:block}
.poster{position:relative;aspect-ratio:4/5;background:repeating-linear-gradient(135deg,#1F1B1B 0 10px,#252020 10px 20px);display:flex;align-items:center;justify-content:center;width:100%;border:0;padding:0;color:var(--white)}
.poster .playb{width:64px;height:64px;border-radius:50%;background:rgba(14,12,12,.75);border:2px solid var(--white);display:flex;align-items:center;justify-content:center;font-size:22px;padding-left:4px}
.poster .cap{position:absolute;left:14px;bottom:14px;font-family:var(--mono);font-size:11px;color:var(--muted);background:rgba(14,12,12,.8);padding:4px 8px;border-radius:6px;text-align:left}
.body{padding:16px;display:flex;flex-direction:column;gap:12px}
.title-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.tname{font-size:24px;font-weight:800;font-stretch:80%;line-height:1.05;text-wrap:pretty;overflow-wrap:anywhere}
.song{font-size:14px;color:var(--lilac)}
.st{flex:none;height:30px;padding:0 12px;border-radius:15px;border:1.5px solid var(--white);background:transparent;color:var(--white);font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.st.gravado{background:var(--purple);border-color:var(--purple)}
.st.postado{background:var(--red);border-color:var(--red)}
.st[disabled]{cursor:default;opacity:1}
.st[disabled]:active{transform:none}
.tags{display:flex;gap:8px;flex-wrap:wrap}
.tag{background:var(--ink);border-radius:8px;padding:6px 10px;font-size:13px;color:var(--soft)}
.tag.mono{font-size:12px;color:var(--white)}
.crew{display:flex;align-items:center;gap:10px}
.crew span{margin-left:10px;font-size:13px;color:var(--muted)}
.more{display:flex;gap:16px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px}
.lnk{background:none;border:0;padding:0;font-size:13px;color:var(--muted);text-decoration:none;font-family:var(--sans)}
.lnk:hover{color:var(--white)}
.lnk.danger{color:var(--error)}
.empty{padding:40px 0;text-align:center;color:var(--muted);font-size:15px}

/* Vídeos */
.upload{height:50px;border-radius:14px;border:1.5px dashed var(--purple);background:transparent;color:var(--white);font-size:15px;font-weight:700}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vtile{position:relative;aspect-ratio:9/16;border-radius:16px;overflow:hidden;background:repeating-linear-gradient(135deg,#1F1B1B 0 10px,#252020 10px 20px);border:1px solid var(--line);padding:0;color:var(--white);text-align:left}
.vtile video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vtile .cap{position:absolute;left:0;right:0;bottom:0;padding:24px 10px 10px;background:linear-gradient(transparent,rgba(14,12,12,.92));display:flex;align-items:center;gap:8px}
.vtile .cap .av{width:24px;height:24px;font-size:10px;border:0}
.vtile .cap div:last-child{font-size:12px;font-weight:600;line-height:1.2;min-width:0;overflow-wrap:anywhere}

/* Votação */
.poll{text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:16px;color:var(--white);display:flex;flex-direction:column;gap:12px;width:100%}
.poll.mine{border-color:var(--purple)}
.poll .pn{font-size:20px;font-weight:800;font-stretch:80%;line-height:1.1;overflow-wrap:anywhere}
.poll .cnt{flex:none;font-size:30px;font-weight:900;font-stretch:72%;line-height:1}
.poll .cnt small{font-size:14px;color:var(--dim)}
.track{height:10px;border-radius:5px;background:var(--ink);overflow:hidden}
.track i{display:block;height:100%;border-radius:5px;background:var(--purple);transition:width .4s cubic-bezier(.2,.8,.2,1)}
.poll .avs .av{width:24px;height:24px;font-size:10px;margin-right:-6px}

/* Agenda */
.adays{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.aday{height:76px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--white);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0}
.aday small{font-family:var(--mono);font-size:9px}
.aday b{font-size:22px;font-weight:900;font-stretch:80%}
.aday i{width:6px;height:6px;border-radius:50%}
.aday.on{background:var(--white);color:var(--ink);border-color:var(--white)}
.aday.show{border-color:var(--red)}
.aday.show.on{background:var(--red);color:var(--white)}
.showcard{border-radius:20px;background:var(--red);padding:18px;display:flex;flex-direction:column;gap:6px}
.showcard .big{font-size:32px;font-weight:900;font-stretch:72%;text-transform:uppercase;line-height:1}
.showcard a{color:var(--white);font-size:14px}
.arow{display:grid;grid-template-columns:4px 1fr auto;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.arow .bar{align-self:stretch;border-radius:2px;background:var(--white)}
.arow .bar.gravado{background:var(--purple)} .arow .bar.postado{background:var(--red)}
.arow .n{font-size:18px;font-weight:800;font-stretch:80%;line-height:1.1;overflow-wrap:anywhere}
.arow .p{font-size:13px;color:var(--muted)}
.arow .avs .av{width:22px;height:22px;font-size:9px;margin-right:-6px}
.arow .st{height:28px;font-size:10px;padding:0 10px}
.freeday{height:56px;border-radius:16px;border:1.5px dashed var(--line);background:transparent;color:var(--muted);font-size:15px;width:100%}

/* Navegação */
.nav{position:absolute;left:0;right:0;bottom:0;background:var(--ink);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);align-items:center;padding:6px 8px calc(var(--bottom) + 12px);z-index:10}
.nav button{height:60px;border:none;background:transparent;color:var(--dim);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:12px;font-weight:700;padding:0}
.nav button.on{color:var(--white)}
.nav .ic{width:28px;height:24px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--white)}
.nav .ic svg{width:18px;height:18px}
.nav button.on .ic{background:var(--purple)}
.nav .plus .ic{width:48px;height:48px;border-radius:50%;background:var(--red)}
.nav .plus .ic svg{width:22px;height:22px}

/* Camadas */
.toast{position:absolute;left:18px;right:18px;bottom:calc(var(--bottom) + 108px);background:var(--purple);color:var(--white);border-radius:14px;padding:14px 16px;font-size:14px;font-weight:600;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.4)}
/* Janelas que sobem de baixo (design do Claude Design) */
.sheet-bg{position:absolute;inset:0;z-index:40;background:rgba(0,0,0,.62);display:flex;flex-direction:column;justify-content:flex-end}
.sheet{max-height:90%;background:var(--ink);border-top:1px solid var(--line);border-radius:28px 28px 0 0;display:flex;flex-direction:column;overflow:hidden}
.grab{flex:none;display:flex;justify-content:center;padding:10px 0 4px}
.grab i{width:40px;height:5px;border-radius:3px;background:#3A3232}
.sheet-scroll>*{flex-shrink:0}
.sheet-scroll{overflow-y:auto;scrollbar-width:none;padding:10px 22px calc(var(--bottom) + 34px);display:flex;flex-direction:column;gap:18px}
.sheet-foot{flex:none;border-top:1px solid var(--line);padding:12px 16px calc(var(--bottom) + 22px);display:flex;gap:10px;background:var(--ink)}
.sk{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.stt{font-size:36px;line-height:.92;font-weight:900;font-stretch:72%;text-transform:uppercase;text-wrap:pretty;overflow-wrap:anywhere}
.stx{font-size:15px;line-height:1.45;color:#D8D1CD;text-wrap:pretty}
.stx b{color:var(--white)}
.bigav{flex:none;width:64px;height:64px;border-radius:50%;border:3px solid var(--purple);font-size:26px;font-weight:900;display:flex;align-items:center;justify-content:center}
.menu{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.mi{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:54px;padding:0 16px;border:none;border-top:1px solid var(--line);background:transparent;color:var(--white);font-size:15px;font-weight:600;text-align:left}
.mi:first-child{border-top:none}
.mi .mr{color:#7A7270;font-family:var(--mono);font-size:11px}
.mi.danger{color:#FF5A61}
.mi:active{transform:none;background:#211C1C}
.prempill{height:22px;padding:0 8px;border-radius:11px;background:var(--purple);font-size:11px;font-weight:800;display:flex;align-items:center}
.bigcta{height:64px;border-radius:18px;font-size:20px;font-weight:900;font-stretch:85%;text-transform:uppercase}
.memrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #1F1B1B}
.memrow .mn{font-size:16px;font-weight:700;min-width:0;overflow-wrap:anywhere}
.admtag{height:22px;padding:0 8px;border-radius:11px;border:1.5px solid var(--red);font-family:var(--mono);font-size:10px;display:flex;align-items:center}
.rmx{flex:none;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:16px}
.rmx:hover{color:var(--white);border-color:var(--red)}
.checkrow{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--white);text-align:left}
.checkrow .box{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900}
.checkrow.on,.checkrow.on .box{border-color:var(--red)}
.checkrow.on .box{background:var(--red)}
.grow{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:60px;padding:0 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--white);font-size:17px;font-weight:800;font-stretch:85%}
.grow.cur{border-color:var(--purple)}
.infot{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.infot>div{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;border-top:1px solid var(--line)}
.infot>div:first-child{border-top:none}
.infot .k{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.infot .v{font-family:var(--mono);font-size:13px;text-align:right;overflow-wrap:anywhere}
.cmp{border:1px solid var(--line);border-radius:18px;overflow:hidden}
.cmph,.cmpr{display:grid;grid-template-columns:1.3fr 1fr 1fr}
.cmph{font-family:var(--mono);font-size:11px;letter-spacing:.08em}
.cmph span{padding:12px;color:var(--muted)}
.cmph .p{background:var(--red);color:var(--white);font-weight:600}
.cmpr{border-top:1px solid var(--line);font-size:14px;line-height:1.25}
.cmpr span{padding:12px}
.cmpr .l{font-weight:600}
.cmpr .f{color:var(--muted)}
.cmpr .p{background:rgba(224,38,47,.12);font-weight:800}
.cmpr.hl{background:#241515}
.cmpr.hl .l{color:#FF5A61}
.qrcard{background:var(--white);border-radius:22px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:12px}
.qrcard .qr{width:224px;max-width:100%;aspect-ratio:1}
.qrcard .qr svg{width:100%;height:100%;display:block}
.spin{width:64px;height:64px;border-radius:50%;border:5px solid var(--purple);border-top-color:var(--line)}
@media (prefers-reduced-motion:no-preference){.spin{animation:girar 1.2s linear infinite}@keyframes girar{to{transform:rotate(360deg)}}}
.benef{display:flex;flex-direction:column;gap:10px;font-size:16px;font-weight:700}
.benef div{display:flex;gap:10px;align-items:center}
.benef .ck{width:26px;height:26px;border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center;font-size:12px}
.warnbox{display:flex;gap:12px;align-items:center;background:rgba(224,38,47,.12);border:1px solid var(--red);border-radius:14px;padding:12px 14px;font-size:14px;font-weight:600;line-height:1.35}
.warnbox .i{flex:none;width:24px;height:24px;border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px}
.paycard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.paycard.g0{border-color:#4A4141}
.paycard.g1{border-color:#5A2A2D}
.paystat{flex:none;height:26px;padding:0 10px;border-radius:13px;border:1.5px solid var(--white);font-family:var(--mono);font-size:10px;font-weight:600;display:flex;align-items:center;text-transform:uppercase;white-space:nowrap}
.paystat.aprovado{background:var(--purple);border-color:var(--purple)}
.paystat.recusado{background:#2A2424;border-color:#2A2424;color:var(--muted)}
.paystat.reembolso_pedido{border-color:var(--red);color:#FF5A61}
.paystat.reembolsado{border-color:var(--line);color:var(--muted)}
.comlist{display:flex;flex-direction:column;gap:16px}
.crow{display:grid;grid-template-columns:36px 1fr 40px;gap:12px;align-items:start}
.like{border:none;background:transparent;color:#7A7270;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0}
.like.on{color:var(--red)}
.like .h{font-size:20px;line-height:1}
.cinput{flex:1;min-width:0;height:48px;border-radius:24px;border:1.5px solid var(--line);background:var(--card);color:var(--white);padding:0 16px;font-size:16px;outline:none}
.cinput:focus{border-color:var(--purple)}
.csend{flex:none;height:48px;padding:0 18px;border-radius:24px;border:none;background:var(--red);color:var(--white);font-size:15px;font-weight:800}
.csend.off{background:#2A2424}
.btn-ink{height:60px;border-radius:18px;border:none;background:var(--ink);color:var(--white);font-size:19px;font-weight:900;font-stretch:85%;text-transform:uppercase;width:100%}
.btn-white.off{opacity:.5}

/* Topo do Roteiro e reações do card */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.topbar-l{flex:1;display:flex;gap:8px;min-width:0}
.grpbtn{flex:0 1 auto;min-width:0;height:36px;padding:0 12px;border-radius:18px;border:1px solid var(--line);background:var(--card);color:var(--white);font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px;white-space:nowrap}
.grpbtn .nm{min-width:0;overflow:hidden;text-overflow:ellipsis}
.grpbtn .car{color:var(--muted);font-size:10px}
.badge{flex:none;height:36px;padding:0 12px;border-radius:18px;border:1.5px solid var(--red);background:var(--red);color:var(--white);font-size:13px;font-weight:800;white-space:nowrap}
.badge.prem{background:var(--purple);border-color:var(--purple)}
.badge.wait{background:transparent;border-color:var(--purple)}
.socialrow{display:flex;align-items:center;gap:6px;border-top:1px solid var(--line);padding-top:12px}
.rx{height:34px;padding:0 10px;border-radius:17px;border:1.5px solid var(--line);background:transparent;color:var(--white);display:flex;align-items:center;gap:5px;font-family:var(--mono);font-size:12px;font-weight:600}
.rx .e{font-size:15px}
.rx.on{background:rgba(155,93,229,.3);border-color:var(--purple)}
.rx:active{transform:scale(.94)}
.rx.com{margin-left:auto;padding:0 12px}

/* Tela "Premium liberado!" */
.login.lib{background:var(--red)}
.libseal{width:168px;height:168px;border-radius:50%;background:var(--ink);border:6px solid var(--white);box-shadow:0 0 0 10px var(--purple);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.libseal .mono{font-size:10px;letter-spacing:.12em;max-width:120px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.libck{width:26px;height:26px;border-radius:50%;background:var(--ink);display:flex;align-items:center;justify-content:center;font-size:12px}
.sheet .row{display:flex;gap:10px}
.sheet .row>*{flex:1}
.btn-line{height:52px;border-radius:14px;border:1.5px solid var(--line);background:transparent;color:var(--white);font-size:15px;font-weight:700}
.btn-line.danger{color:var(--error);border-color:#4a2626}
select.input{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.viewer{position:absolute;inset:0;background:#000;z-index:50;display:flex;flex-direction:column}
.viewer video{flex:1;min-height:0;width:100%;object-fit:contain;background:#000}
.viewer .bar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:calc(var(--top) + 12px) 16px 12px}
.viewer .info{padding:12px 16px calc(var(--bottom) + 18px);display:flex;justify-content:space-between;align-items:center;gap:12px}
.close{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:rgba(14,12,12,.6);color:var(--white);font-size:18px;flex:none}
.install{background:#2A1F38;border:1px solid var(--purple);border-radius:16px;padding:14px;display:flex;gap:12px;align-items:center;font-size:14px;line-height:1.35}
.install b{display:block;font-size:15px}
.install .x{margin-left:auto;background:none;border:0;color:var(--muted);font-size:18px;padding:4px}

/* Entrada (convite, nome, grupo) */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.seg button{height:44px;border-radius:12px;border:none;background:transparent;color:var(--white);font-size:15px;font-weight:700}
.seg button.on{background:var(--white);color:var(--ink)}
.pilltag{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-family:var(--mono);font-size:12px}
.input.big{height:60px;border-radius:16px;font-size:22px;font-weight:700;border-color:var(--purple)}
.input.code{height:64px;font-family:var(--mono);font-size:26px;font-weight:600;letter-spacing:.12em;text-align:center;border-color:var(--purple)}
.input.big.bad,.input.code.bad{border-color:var(--error)}
.btn-red.off{background:#2A2424;color:#6E6664}
.codebox{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.login .mid{min-height:0}

/* Explorar */
.exmedia{position:relative;aspect-ratio:9/16;max-height:560px;width:100%;background:#000;overflow:hidden}
.exmedia iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.exbadges{position:absolute;top:14px;left:14px;display:flex;gap:6px;pointer-events:none}
.exbadges span{font-family:var(--mono);font-size:11px;background:rgba(14,12,12,.8);padding:4px 8px;border-radius:6px}
.exbadges .dim{color:var(--muted)}
.exreacts{position:absolute;right:10px;bottom:70px;display:flex;flex-direction:column;gap:8px}
.exreacts button{width:56px;height:58px;border-radius:16px;border:1.5px solid transparent;background:rgba(14,12,12,.7);color:var(--white);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0}
.exreacts button.on{background:rgba(155,93,229,.45);border-color:var(--purple)}
.exreacts button:active{transform:scale(.92)}
.exreacts .e{font-size:22px;line-height:1}
.exreacts .n{font-family:var(--mono);font-size:10px;font-weight:600}
.extitle{position:absolute;left:0;right:76px;bottom:48px;padding:40px 14px 12px;background:linear-gradient(transparent,rgba(14,12,12,.9));display:flex;flex-direction:column;gap:4px;pointer-events:none}
.usebtn{flex:none;height:44px;padding:0 16px;border-radius:14px;border:1.5px solid var(--red);background:var(--red);color:var(--white);font-size:14px;font-weight:800}
.usebtn.used{background:transparent;cursor:default}
.reportlnk{align-self:flex-start;border:none;background:transparent;color:#6E6664;font-size:12px;text-decoration:underline;padding:2px 0;font-family:var(--sans)}
.nav button{font-size:11px}
</style>
</head>
<body>
<div class="app" id="app"><div id="root"></div><div class="toast" id="toast" role="status" hidden></div></div>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js" integrity="sha384-8FWZA6BGMXhsfO+BLtrJK0We6gg5o1JyO8xQm6peWDEUs17ACA5ziE/NIAkl9z2k" crossorigin="anonymous"></script>
<script src="app.js"></script>
</body>
</html>
