<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Roteiro de Trends · ARIRANG SP</title>
<meta name="description" content="O roteiro de trends da galera para a semana do show do BTS em São Paulo.">
<meta name="theme-color" content="#0E0C0C">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trends SP">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=JetBrains+Mono:wght@400;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  --red:#E0262F; --purple:#9B5DE5; --lilac:#C9B3EE; --white:#F6F2EF; --ink:#0E0C0C; --card:#1A1717;
  --line:#2E2929; --muted:#A39C98; --dim:#7A7270; --soft:#D8D1CD; --error:#FF6B6B;
  --sans:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  --top:env(safe-area-inset-top,0px); --bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
*{box-sizing:border-box}
*::-webkit-scrollbar{display:none;width:0;height:0}
html,body{margin:0;height:100%}
body{background:#151212;font-family:var(--sans);color:var(--white);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
[hidden]{display:none!important}
a{color:var(--lilac)}
button,input,select{font-family:inherit;color:inherit}
button{cursor:pointer}
button:active{transform:scale(.98)}
:focus-visible{outline:2px solid var(--purple);outline-offset:2px}

.app{position:relative;max-width:480px;height:100%;margin:0 auto;background:var(--ink);overflow:hidden}
@media (min-width:520px){.app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
.scroll{position:absolute;inset:0;overflow-y:auto;scrollbar-width:none;padding:calc(var(--top) + 16px) 18px calc(var(--bottom) + 120px)}
.stack{display:flex;flex-direction:column;gap:16px}
.mono{font-family:var(--mono)}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.h1{font-size:40px;font-weight:900;font-stretch:72%;text-transform:uppercase;line-height:1;margin:0}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}

/* Login / boas-vindas */
.login{position:absolute;inset:0;display:flex;flex-direction:column;padding:calc(var(--top) + 32px) 28px calc(var(--bottom) + 40px)}
.login .tag{display:flex;gap:6px;align-items:center;color:var(--muted)}
.login .tag i{width:8px;height:8px;border-radius:50%;background:var(--purple)}
.login .mid{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px}
.login .tour{font-size:15px;font-weight:600;color:var(--red);letter-spacing:.2em}
.login .big{font-size:64px;line-height:.88;font-weight:900;font-stretch:72%;text-transform:uppercase;letter-spacing:-.01em}
.login .big span{color:var(--red)}
.login .bar{height:4px;width:64px;background:var(--white)}
.login .lede{font-size:17px;line-height:1.4;color:var(--soft);max-width:300px;text-wrap:pretty;margin:0}
.btn-white{height:56px;border-radius:16px;border:none;background:var(--white);color:var(--ink);font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:12px;width:100%}
.btn-white .g{width:26px;height:26px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center}
.btn-red{height:56px;border-radius:16px;border:none;background:var(--red);color:var(--white);font-size:17px;font-weight:800;letter-spacing:.02em;width:100%}
.btn-red[disabled],.btn-white[disabled]{opacity:.5}
.foot{text-align:center;font-family:var(--mono);font-size:11px;color:var(--dim)}

/* Campos */
.field{display:flex;flex-direction:column;gap:8px}
.field>span{color:var(--muted)}
.input{height:52px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--white);padding:0 14px;font-size:16px;outline:none;width:100%;min-width:0}
.input:focus{border-color:var(--purple)}
.input.bad{border-color:var(--error)}
.input.good{border-color:var(--purple)}
.err{font-size:13px;color:var(--error)}
.ok{font-size:13px;color:var(--lilac)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--white);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0;height:58px}
.day small{font-family:var(--mono);font-size:9px}
.day b{font-size:18px;font-weight:800}
.day.on{background:var(--red);border-color:var(--red)}
.people{display:flex;flex-wrap:wrap;gap:8px}
.person{height:44px;padding:0 14px 0 6px;border-radius:22px;border:1.5px solid var(--line);background:transparent;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600}
.person.on{background:#2A1F38;border-color:var(--purple)}

/* Avatares */
.av{flex:none;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
.avs{display:flex}
.avs .av{margin-right:-8px;border:2px solid var(--card)}
.me{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;border:2px solid var(--purple);font-size:16px;padding:0}

/* Feed */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-18px;padding-inline:18px}
.chip{flex:none;height:34px;padding:0 14px;border-radius:17px;border:1px solid var(--line);background:transparent;color:var(--white);font-size:14px;font-weight:600}
.chip span{opacity:.6;font-weight:500}
.chip.on{background:var(--white);color:var(--ink);border-color:var(--white)}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.embed{height:580px;max-height:78vh;background:#000}
.embed.preview{height:420px;border-radius:16px;overflow:hidden;border:1px solid var(--line)}
a.poster{text-decoration:none}
.embed iframe{width:100%;height:100%;border:0;display:block}
.poster{position:relative;aspect-ratio:4/5;background:repeating-linear-gradient(135deg,#1F1B1B 0 10px,#252020 10px 20px);display:flex;align-items:center;justify-content:center;width:100%;border:0;padding:0;color:var(--white)}
.poster .playb{width:64px;height:64px;border-radius:50%;background:rgba(14,12,12,.75);border:2px solid var(--white);display:flex;align-items:center;justify-content:center;font-size:22px;padding-left:4px}
.poster .cap{position:absolute;left:14px;bottom:14px;font-family:var(--mono);font-size:11px;color:var(--muted);background:rgba(14,12,12,.8);padding:4px 8px;border-radius:6px;text-align:left}
.body{padding:16px;display:flex;flex-direction:column;gap:12px}
.title-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.tname{font-size:24px;font-weight:800;font-stretch:80%;line-height:1.05;text-wrap:pretty;overflow-wrap:anywhere}
.song{font-size:14px;color:var(--lilac)}
.st{flex:none;height:30px;padding:0 12px;border-radius:15px;border:1.5px solid var(--white);background:transparent;color:var(--white);font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.st.gravado{background:var(--purple);border-color:var(--purple)}
.st.postado{background:var(--red);border-color:var(--red)}
.st[disabled]{cursor:default;opacity:1}
.st[disabled]:active{transform:none}
.tags{display:flex;gap:8px;flex-wrap:wrap}
.tag{background:var(--ink);border-radius:8px;padding:6px 10px;font-size:13px;color:var(--soft)}
.tag.mono{font-size:12px;color:var(--white)}
.crew{display:flex;align-items:center;gap:10px}
.crew span{margin-left:10px;font-size:13px;color:var(--muted)}
.more{display:flex;gap:16px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px}
.lnk{background:none;border:0;padding:0;font-size:13px;color:var(--muted);text-decoration:none;font-family:var(--sans)}
.lnk:hover{color:var(--white)}
.lnk.danger{color:var(--error)}
.empty{padding:40px 0;text-align:center;color:var(--muted);font-size:15px}

/* Vídeos */
.upload{height:50px;border-radius:14px;border:1.5px dashed var(--purple);background:transparent;color:var(--white);font-size:15px;font-weight:700}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vtile{position:relative;aspect-ratio:9/16;border-radius:16px;overflow:hidden;background:repeating-linear-gradient(135deg,#1F1B1B 0 10px,#252020 10px 20px);border:1px solid var(--line);padding:0;color:var(--white);text-align:left}
.vtile video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vtile .cap{position:absolute;left:0;right:0;bottom:0;padding:24px 10px 10px;background:linear-gradient(transparent,rgba(14,12,12,.92));display:flex;align-items:center;gap:8px}
.vtile .cap .av{width:24px;height:24px;font-size:10px;border:0}
.vtile .cap div:last-child{font-size:12px;font-weight:600;line-height:1.2;min-width:0;overflow-wrap:anywhere}

/* Votação */
.poll{text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:16px;color:var(--white);display:flex;flex-direction:column;gap:12px;width:100%}
.poll.mine{border-color:var(--purple)}
.poll .pn{font-size:20px;font-weight:800;font-stretch:80%;line-height:1.1;overflow-wrap:anywhere}
.poll .cnt{flex:none;font-size:30px;font-weight:900;font-stretch:72%;line-height:1}
.poll .cnt small{font-size:14px;color:var(--dim)}
.track{height:10px;border-radius:5px;background:var(--ink);overflow:hidden}
.track i{display:block;height:100%;border-radius:5px;background:var(--purple);transition:width .4s cubic-bezier(.2,.8,.2,1)}
.poll .avs .av{width:24px;height:24px;font-size:10px;margin-right:-6px}

/* Agenda */
.adays{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.aday{height:76px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--white);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0}
.aday small{font-family:var(--mono);font-size:9px}
.aday b{font-size:22px;font-weight:900;font-stretch:80%}
.aday i{width:6px;height:6px;border-radius:50%}
.aday.on{background:var(--white);color:var(--ink);border-color:var(--white)}
.aday.show{border-color:var(--red)}
.aday.show.on{background:var(--red);color:var(--white)}
.showcard{border-radius:20px;background:var(--red);padding:18px;display:flex;flex-direction:column;gap:6px}
.showcard .big{font-size:32px;font-weight:900;font-stretch:72%;text-transform:uppercase;line-height:1}
.showcard a{color:var(--white);font-size:14px}
.arow{display:grid;grid-template-columns:4px 1fr auto;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.arow .bar{align-self:stretch;border-radius:2px;background:var(--white)}
.arow .bar.gravado{background:var(--purple)} .arow .bar.postado{background:var(--red)}
.arow .n{font-size:18px;font-weight:800;font-stretch:80%;line-height:1.1;overflow-wrap:anywhere}
.arow .p{font-size:13px;color:var(--muted)}
.arow .avs .av{width:22px;height:22px;font-size:9px;margin-right:-6px}
.arow .st{height:28px;font-size:10px;padding:0 10px}
.freeday{height:56px;border-radius:16px;border:1.5px dashed var(--line);background:transparent;color:var(--muted);font-size:15px;width:100%}

/* Navegação */
.nav{position:absolute;left:0;right:0;bottom:0;background:var(--ink);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);align-items:center;padding:6px 8px calc(var(--bottom) + 12px);z-index:10}
.nav button{height:60px;border:none;background:transparent;color:var(--dim);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:12px;font-weight:700;padding:0}
.nav button.on{color:var(--white)}
.nav .ic{width:28px;height:24px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--white)}
.nav .ic svg{width:18px;height:18px}
.nav button.on .ic{background:var(--purple)}
.nav .plus .ic{width:48px;height:48px;border-radius:50%;background:var(--red)}
.nav .plus .ic svg{width:22px;height:22px}

/* Camadas */
.toast{position:absolute;left:18px;right:18px;bottom:calc(var(--bottom) + 108px);background:var(--purple);color:var(--white);border-radius:14px;padding:14px 16px;font-size:14px;font-weight:600;z-index:30;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.6);z-index:40;display:flex;align-items:flex-end}
.sheet{width:100%;background:var(--card);border-top:1px solid var(--line);border-radius:22px 22px 0 0;padding:20px 18px calc(var(--bottom) + 24px);display:flex;flex-direction:column;gap:14px}
.sheet h3{margin:0;font-size:26px;font-weight:900;font-stretch:72%;text-transform:uppercase}
.sheet .row{display:flex;gap:10px}
.sheet .row>*{flex:1}
.btn-line{height:52px;border-radius:14px;border:1.5px solid var(--line);background:transparent;color:var(--white);font-size:15px;font-weight:700}
.btn-line.danger{color:var(--error);border-color:#4a2626}
select.input{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.viewer{position:absolute;inset:0;background:#000;z-index:50;display:flex;flex-direction:column}
.viewer video{flex:1;min-height:0;width:100%;object-fit:contain;background:#000}
.viewer .bar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:calc(var(--top) + 12px) 16px 12px}
.viewer .info{padding:12px 16px calc(var(--bottom) + 18px);display:flex;justify-content:space-between;align-items:center;gap:12px}
.close{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:rgba(14,12,12,.6);color:var(--white);font-size:18px;flex:none}
.install{background:#2A1F38;border:1px solid var(--purple);border-radius:16px;padding:14px;display:flex;gap:12px;align-items:center;font-size:14px;line-height:1.35}
.install b{display:block;font-size:15px}
.install .x{margin-left:auto;background:none;border:0;color:var(--muted);font-size:18px;padding:4px}
</style>
</head>
<body>
<div class="app" id="app"><div id="root"></div><div class="toast" id="toast" role="status" hidden></div></div>

<script>
(() => {
  const SUPABASE_URL = "https://gjyqwzseemmqlnovffqp.supabase.co";
  const SUPABASE_KEY = "sb_publishable_VfyRm7WtECRnxHIvI5dAzA_Cz5XMEmg";

  const RED = "#E0262F", PURPLE = "#9B5DE5", WHITE = "#F6F2EF", INK = "#0E0C0C";
  const PALETTE = [[RED,WHITE],[PURPLE,WHITE],[WHITE,INK],["#4A4141",WHITE],["#C9B3EE",INK],["#F2B8BB",INK],["#2F6E63",WHITE],["#D9A23B",INK]];
  const SHOW = "2026-10-30";
  const DAYS = ["2026-10-26","2026-10-27","2026-10-28","2026-10-29","2026-10-30","2026-10-31","2026-11-01"];
  const WD = ["DOM","SEG","TER","QUA","QUI","SEX","SÁB"];
  const ST = {a_gravar:"A gravar", gravado:"Gravado", postado:"Postado"};
  const NEXT = {a_gravar:"gravado", gravado:"postado", postado:"a_gravar"};
  const VENUE = "Estádio do MorumBIS, Praça Roberto Gomes Pedrosa, 1, Morumbi, São Paulo - SP";
  const MAX_VIDEO = 50 * 1024 * 1024;

  const ICONS = {
    feed:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>',
    agenda:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>',
    nova:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',

    videos:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>'
  };
  const G_LOGO = '<svg viewBox="0 0 48 48" width="18" height="18"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.6 5.4 2.6 13.3l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.4 5.7c4.3-4 6.9-9.9 6.9-17.1z"/><path fill="#FBBC05" d="M10.5 28.6c-.5-1.4-.8-3-.8-4.6s.3-3.2.8-4.6l-7.9-6.1C.9 16.6 0 20.2 0 24s.9 7.4 2.6 10.7l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.4-5.7c-2.1 1.4-4.8 2.3-8.5 2.3-6.3 0-11.6-4.1-13.5-9.9l-7.9 6.1C6.6 42.6 14.6 48 24 48z"/></svg>';

  // ——— Estado ———
  const S = {
    sb:null, uid:null, user:null, me:null, loaded:false,
    profiles:{}, trends:[], votos:[], videos:[], videosMissing:false,
    screen:"feed", filter:"todas", day:null, toast:null,
    form:null, errors:{}, editing:null, sheet:null, viewer:null, busy:false
  };
  try { const s = localStorage.getItem("trends-screen"); if (s && s !== "nova") S.screen = s; } catch(e) {}

  // ——— Utilidades ———
  const $root = document.getElementById("root"), $toast = document.getElementById("toast");
  const el = (tag, attrs = {}, ...kids) => {
    const n = document.createElement(tag);
    for (const [k,v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === "class") n.className = v;
      else if (k === "text") n.textContent = v;
      else if (k === "html") n.innerHTML = v;
      else if (k === "style" && typeof v === "object") Object.assign(n.style, v);
      else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
      else if (k in n && typeof v !== "string") n[k] = v;
      else n.setAttribute(k, v === true ? "" : v);
    }
    for (const k of kids.flat()) if (k != null && k !== false) n.append(k.nodeType ? k : document.createTextNode(k));
    return n;
  };
  const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : "10000000-1000-4000-8000-100000000000".replace(/[018]/g, c => (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16)));
  let toastT;
  // O aviso fica fora da tela principal, para não recarregar os vídeos ao aparecer
  const showToast = (msg, stay) => { clearTimeout(toastT); $toast.textContent = msg || ""; $toast.hidden = !msg; if (msg && !stay) toastT = setTimeout(() => $toast.hidden = true, 2600); };
  const flash = msg => showToast(msg);
  const fail = (e, what) => flash(`${what}: ${e && e.message ? e.message : e}`);

  const dObj = iso => { const [y,m,d] = iso.split("-").map(Number); return new Date(Date.UTC(y, m-1, d)); };
  const todaySP = () => new Intl.DateTimeFormat("en-CA",{timeZone:"America/Sao_Paulo",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());
  const dd = iso => iso.slice(8);
  const wd = iso => WD[dObj(iso).getUTCDay()];
  const dayLabel = iso => `${wd(iso)} ${dd(iso)}/${iso.slice(5,7)}`;

  const tiktokId = l => { const m = (l || "").match(/tiktok\.com\/.*video\/(\d+)/); return m ? m[1] : null; };
  const tiktokHandle = l => { const m = (l || "").match(/tiktok\.com\/(@[\w.\-]+)/); return m ? m[1] : "TikTok"; };
  const isTiktok = l => /^https?:\/\/([\w-]+\.)?tiktok\.com\//i.test((l || "").trim());
  const videoUrl = path => S.sb.storage.from("videos").getPublicUrl(path).data.publicUrl;

      S.day === SHOW ? el("div",{class:"showcard"},
        el("span",{class:"eyebrow",text:"Sexta 30/10 · dia do show"}),
        el("span",{class:"big",html:"BTS · ARIRANG<br>MorumBIS"}),
        el("span",{style:{fontSize:"14px"},text:"Portões 16h · show 20h · lightstick carregado"}),
        el("a",{href:"https://www.google.com/maps/dir/?api=1&destination=" + encodeURIComponent(VENUE),target:"_blank",rel:"noopener"},"Como chegar ↗")) : null,
      el("div",{class:"eyebrow",style:{color:"#A39C98"},text:`${dayLabel(S.day)} · ${items.length} ${items.length === 1 ? "trend" : "trends"}`}),
      items.map(t => el("div",{class:"arow"},
        el("div",{class:"bar " + (t.status || "a_gravar")}),
        el("div",{style:{display:"flex",flexDirection:"column",gap:"4px",minWidth:0}},
          el("span",{class:"n",text:t.titulo}),
          t.local ? el("span",{class:"p",text:t.local}) : null,
          el("div",{style:{marginTop:"4px"}}, crew(t.participantes || []))),
        statusBtn(t))),
      items.length ? null : el("button",{class:"freeday",onclick:() => { S.form = blankForm(S.day); go("nova"); }},"Dia livre · + adicionar trend"));
  }

  function navBar() {
    const def = [["feed","Roteiro"],["agenda","Agenda"],["nova","Nova"],["votacao","Votação"],["videos","Vídeos"]];
    return el("nav",{class:"nav"}, def.map(([k,l]) =>
      el("button",{class:(S.screen === k ? "on" : "") + (k === "nova" ? " plus" : ""), onclick:() => { if (k === "nova") { S.form = null; S.editing = null; } go(k); }},
        el("span",{class:"ic",html:ICONS[k]}), el("span",{text:l}))));
  }

  function sheetLayer() {
    const s = S.sheet; if (!s) return null;
    const close = () => { S.sheet = null; render(); };
    let content;
    if (s.type === "conta") {
      if (s.val == null) s.val = S.me.nome;
      content = [el("h3",{text:"Minha conta"}),
        el("label",{class:"field"}, el("span",{class:"eyebrow",text:"Seu nome no grupo"}), el("input",{class:"input",id:"c-nome",value:s.val,maxlength:"40",oninput:e => s.val = e.target.value})),
        el("button",{class:"btn-red",onclick:async () => {
          const nome = (s.val || "").trim(); if (!nome) return;
          const {error} = await S.sb.from("profiles").update({nome}).eq("id", S.uid);
          if (error) return fail(error, "Nome não salvo");
          S.sheet = null; await loadAll(); flash("Nome atualizado");
        }},"Salvar nome"),
        el("button",{class:"btn-line",onclick:async () => { S.sheet = null; await S.sb.auth.signOut(); }},"Sair"),
        el("button",{class:"lnk danger",style:{alignSelf:"center",padding:"6px"},onclick:() => { S.sheet = {type:"excluir"}; render(); }},"Excluir minha conta")];
    } else if (s.type === "excluir") {
      const mineCount = S.trends.filter(t => t.owner === S.uid).length, vidCount = S.videos.filter(v => v.owner === S.uid).length;
      content = [el("h3",{text:"Excluir minha conta"}),
        el("p",{style:{margin:0,fontSize:"15px",lineHeight:"1.45",color:"#D8D1CD"}},
          "Isso apaga de vez o seu nome no grupo, ",
          el("b",{text:`${mineCount} ${mineCount === 1 ? "trend criada" : "trends criadas"}`}), " por você, os seus votos e ",
          el("b",{text:`${vidCount} ${vidCount === 1 ? "vídeo enviado" : "vídeos enviados"}`}), ". Não dá para desfazer."),
        el("button",{class:"btn-line danger",disabled:S.busy,onclick:deleteAccount}, S.busy ? "Excluindo…" : "Excluir de vez")];
    } else if (s.type === "trend") {
      const t = s.trend;
      content = [el("h3",{text:t.titulo}),
        el("button",{class:"btn-line",onclick:() => {
          S.form = {link:t.ref_link || "", name:t.titulo, song:t.musica || "", day:t.dia, place:t.local || "", people:(t.participantes || []).filter(u => S.profiles[u])};
          S.editing = t.id; S.sheet = null; S.screen = "nova"; S.errors = {}; render();
        }},"Editar trend"),
        s.confirm
          ? el("button",{class:"btn-line danger",onclick:() => deleteTrend(t)},"Confirmar: apagar de vez")
          : el("button",{class:"btn-line danger",onclick:() => { s.confirm = true; render(); }},"Apagar trend")];
    } else if (s.type === "enviar" || s.type === "qualtrend") {
      if (s.chosen == null) s.chosen = s.itemId || "";
      const pick = el("input",{type:"file",accept:"video/*",hidden:true,onchange:ev => { const file = ev.target.files && ev.target.files[0]; ev.target.value = ""; if (file) uploadVideo(file, s.chosen || null); }});
      content = [el("h3",{text: s.file ? "De qual trend é esse vídeo?" : "Enviar vídeo"}),
        el("label",{class:"field"}, el("span",{class:"eyebrow",text:"Trend"}),
          el("select",{class:"input",id:"v-trend",onchange:e => s.chosen = e.target.value},
            el("option",{value:"",text:"Sem trend específica"}),
            S.trends.map(t => el("option",{value:t.id,selected:t.id === s.chosen,text:t.titulo})))),
        el("p",{style:{margin:0,fontSize:"13px",color:"#A39C98"},text:"Até 50 MB. Grave em 1080p para caber."}),
        s.file ? el("button",{class:"btn-red",onclick:() => uploadVideo(s.file, s.chosen || null)},"Enviar") : el("button",{class:"btn-red",disabled:S.videosMissing,onclick:() => pick.click()},"Escolher vídeo"),
        pick];
    }
    return el("div",{class:"sheet-bg",onclick:e => { if (e.target === e.currentTarget) close(); }},
      el("div",{class:"sheet"}, ...content, el("button",{class:"btn-line",onclick:close},"Cancelar")));
  }

  function viewerLayer() {
    const v = S.viewer; if (!v) return null;
    return el("div",{class:"viewer"},
      el("div",{class:"bar"},
        el("div",{style:{display:"flex",alignItems:"center",gap:"10px",minWidth:0}}, av(v.owner), el("div",{style:{fontWeight:700,overflowWrap:"anywhere"},text:v.titulo || "Vídeo"})),
        el("button",{class:"close","aria-label":"Fechar",onclick:() => { S.viewer = null; render(); }},"✕")),
      el("video",{src:videoUrl(v.path), controls:true, autoplay:true, playsInline:true}),
      el("div",{class:"info"},
        el("span",{class:"mono",style:{fontSize:"12px",color:"#A39C98"},text:`enviado por ${nameOf(v.owner)}`}),
        el("div",{style:{display:"flex",gap:"16px"}},
          el("a",{class:"lnk",href:videoUrl(v.path),target:"_blank",rel:"noopener"},"Abrir em tela cheia"),
          v.owner === S.uid ? el("button",{class:"lnk danger",onclick:() => deleteVideo(v)},"Apagar") : null)));
  }

  // ——— Render ———
  // Atualizações que chegam do grupo esperam a pessoa sair do vídeo que está assistindo
  let pending = false;
  function softRender() {
    const a = document.activeElement;
    if (a && a.tagName === "IFRAME") { pending = true; return; }
    render();
  }
  addEventListener("focus", () => { if (pending) { pending = false; render(); } });
  function render() {
    pending = false;
    const sc = document.querySelector(".scroll"), top = sc ? sc.scrollTop : 0;
    const act = document.activeElement, focusId = act && act.id, sel = act && "selectionStart" in act ? [act.selectionStart, act.selectionEnd] : null;
    let nodes;
    if (!S.sb) nodes = [el("div",{class:"login"}, el("div",{class:"mid"}, el("div",{class:"big",style:{fontSize:"40px"},text:"Sem conexão"}), el("p",{class:"lede",text:"Confira a internet e abra o app de novo."})))];
    else if (!S.uid) nodes = [loginScreen()];
    else if (!S.loaded) nodes = [el("div",{class:"login"}, el("div",{class:"mid"}, el("div",{class:"tour",text:"CARREGANDO"}), el("div",{class:"big",html:"Roteiro<br>de<br><span>trends</span>"})))];
    else if (!S.me) nodes = [nameScreen()];
    else {
      if (S.screen === "nova" && !S.form) S.form = blankForm();
      const view = {feed:feedScreen, nova:novaScreen, videos:videosScreen, votacao:votacaoScreen, agenda:agendaScreen}[S.screen] || feedScreen;
      nodes = [el("div",{class:"scroll"}, view()), navBar(), sheetLayer(), viewerLayer()];
    }
    $root.replaceChildren(...nodes.filter(Boolean));
    const sc2 = document.querySelector(".scroll"); if (sc2) sc2.scrollTop = top;
    if (focusId) { const f = document.getElementById(focusId); if (f) { f.focus({preventScroll:true}); if (sel && "setSelectionRange" in f) try { f.setSelectionRange(sel[0], sel[1]); } catch(e) {} } }
  }

  // ——— Início ———
  try { S.sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {auth:{persistSession:true, autoRefreshToken:true}}); } catch(e) { S.sb = null; }
  render();
  if (S.sb) {
    S.sb.auth.getSession().then(({data}) => setSession(data.session));
    S.sb.auth.onAuthStateChange((_ev, session) => { setTimeout(() => setSession(session), 0); });
  }
  if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
})();
</script>
</body>
</html>
